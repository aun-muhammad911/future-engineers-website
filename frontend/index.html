<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FutureEngineers.pk — Engineering Careers, Scholarships & Certifications in Pakistan</title>
    <meta name="description" content="Pakistan's premier engineering career platform. Find vetted jobs, internships, HEC & international scholarships, industry certifications, and ATS CV templates for engineering graduates." />
    <meta name="keywords" content="engineering jobs Pakistan, engineering internships Pakistan, HEC scholarships, engineering courses, ATS CV templates, NUST UET GIKI NED FAST careers" />
    <meta name="theme-color" content="#2563eb" />

    <!-- Open Graph -->
    <meta property="og:title" content="FutureEngineers.pk — Pakistan's Engineering Hub" />
    <meta property="og:description" content="Vetted engineering internships, fully funded scholarships, technical certifications, and free ATS CV templates for Pakistani engineers." />
    <meta property="og:type" content="website" />

    <!-- Favicon: gear emoji -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>" />

    <!-- Preconnect Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Anti-flash: apply saved theme before React mounts -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('fe_theme');
          var html = document.documentElement;
          if (t === 'dark') {
            html.classList.add('dark');
            html.classList.remove('light');
          } else {
            html.classList.add('light');
            html.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
